name: Atualizar FCA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install openpyxl requests

      - name: Baixar planilhas e gerar dashboard
        env:
          FCA_LINKS_URL: ${{ secrets.FCA_LINKS_URL }}
          TZ: America/Sao_Paulo
        run: python fca_consolidar.py

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas."
          else
            git commit -m "Atualizacao automatica FCA - $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
            git pull --rebase
            git push
          fi
